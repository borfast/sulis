version: 2
updates:
  # Both modules. store/sql versions independently and carries the only
  # references to the PostgreSQL and SQLite drivers, so watching the root
  # alone left those two unwatched entirely.
  #
  # A bump in either module still needs a manual `go mod tidy` in store/sql,
  # because it replaces the root module with ../.. and Dependabot updates one
  # manifest at a time.
  - package-ecosystem: gomod
    directories:
      - /
      - /store/sql
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keeps the SHA-pinned actions in .github/workflows current. Without this,
  # pinning trades supply-chain risk for staleness.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
