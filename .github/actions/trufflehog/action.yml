# On a pull_request the workflow checks out the PR's own tree, so this
# composite action — and the workflow step that calls it — are read from the
# branch under review, not from main. A fork PR can therefore rewrite its own
# secret scan: weaken the flags, exclude the path holding its payload, or
# point the checksum at a binary of its choosing. Nothing inside this file
# can prevent that, and it is not meant to — the control is human review. Any
# diff touching .github/workflows or .github/actions is security-relevant and
# has to be read before the run is approved.
name: trufflehog
description: >-
  Scan this repository for leaked credentials with a checksum-verified
  trufflehog release binary.

inputs:
  since:
    description: >-
      Base commit the range scan diffs against. Setting it selects a gate:
      the working tree is scanned and so is the range. Leave it empty to walk
      the entire history instead, which is what the weekly workflow does.
    required: false
    default: ''
  head:
    description: >-
      Commit the range scan stops at. Required whenever `since` is set, and
      it must be the pull request's head sha on a pull_request — never HEAD,
      which there is the merge ref, and see the args comment below for what
      passing it costs. The pushed commit on a push. Ignored when `since` is
      empty.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # trufflehog cannot be installed the way ci.yml installs staticcheck,
        # gosec and govulncheck: `go run <module>@<version>` refuses a module
        # whose go.mod carries `replace` directives, and trufflehog's carries
        # two (both forked dependencies). Building from a clone of the tag does
        # work — the clone becomes the main module, so the directives apply —
        # but costs minutes of CPU per run. So the release binary is fetched
        # instead, and pinned the only way a downloaded binary can be: by
        # checksum, verified before it is executed.
        #
        # These two values move together on a bump, and Dependabot tracks
        # neither — a version string is not an action reference or a Go
        # requirement. The checksum is the linux_amd64 archive's, taken from
        # the release's trufflehog_<version>_checksums.txt, which upstream also
        # cosign-signs (.sig/.pem beside it) should this ever need to become a
        # signature check as well.
        VERSION: '3.97.0'
        SHA256: '62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4'

        # Excluded from the history walk only, never from a gate. The file
        # holds a deliberate fixture DSN — the test asserts that a DSN's
        # password never reaches an error string — and the line carries a
        # `trufflehog:ignore` marker. Both of a gate's scans honour that
        # marker, which is why this exclusion must not reach them: a real
        # credential added to that file tomorrow still has to fail the build.
        # A history walk also reads the version committed before the marker
        # existed (commit 28b81dd), and no edit today changes what an old
        # commit contains, so without this a full walk would fail forever.
        #
        # The cost is bounded and deliberate: a future detector never
        # re-examines that one file's history. Narrowing --results is not an
        # alternative to it — see the args comment below for why all three
        # result buckets have to stay on.
        HISTORY_EXCLUDE_GLOBS: 'store/sql/postgres/postgres_test.go'

        SINCE: ${{ inputs.since }}
        HEAD_SHA: ${{ inputs.head }}
      run: |
        set -euo pipefail

        tmp="$(mktemp -d)"
        archive="$tmp/trufflehog.tar.gz"

        curl --silent --show-error --fail --location --output "$archive" \
          "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_linux_amd64.tar.gz"

        # The point of fetching a binary rather than building one: verify it
        # before running it. --strict fails on a malformed checksum line, so a
        # typo above cannot degrade into an unverified run.
        echo "${SHA256}  ${archive}" | sha256sum --check --strict -
        tar -xzf "$archive" -C "$tmp" trufflehog

        # --results names all three buckets explicitly. Upstream's own help
        # text defines them as: verified (confirmed valid by API), unknown
        # (verification failed due to error), unverified (detected but not
        # verified). So `unknown` means a verification that ERRORED — not
        # "this credential kind has no verifier". Anything whose detector
        # reaches no verdict at all lands in `unverified`, which is why the
        # narrower verified,unknown silently dropped private keys, AWS key
        # pairs and Slack tokens. Measured against a planted RSA private key
        # PEM: verified,unknown exits 0 reporting nothing, all three exit 183
        # with `Detector Type: PrivateKey`.
        #
        # All three is also upstream's documented default. It is spelled out
        # rather than omitted so that a future release narrowing that default
        # cannot quietly narrow this gate. --fail turns a finding into a red
        # build, and --no-update stops the binary reaching for a newer self.
        results='--results=verified,unverified,unknown'

        # --fail makes 183 mean "found something". Any other non-zero exit is
        # the tool failing rather than the tree being dirty, and must never be
        # mistaken for a clean scan. `|| rc=$?` is what stops `set -e` from
        # abandoning the scans that follow once the first one finds a
        # credential — a gate runs two, and both have to report.
        findings=0
        scan() {
          label="$1"
          shift
          echo "::group::trufflehog: ${label}"
          rc=0
          "$tmp/trufflehog" "$@" || rc=$?
          echo "::endgroup::"
          case "$rc" in
            0)
              echo "${label}: clean"
              ;;
            183)
              findings=1
              echo "::error::${label}: trufflehog reported a credential"
              ;;
            *)
              echo "::error::${label}: trufflehog exited ${rc}"
              exit "$rc"
              ;;
          esac
        }

        if [ -z "$SINCE" ]; then
          # No base requested, so this is a history walk: one full `git` walk,
          # and the only context in which --exclude-globs is allowed.
          scan "history walk" git 'file://.' "$results" --fail --no-update \
            --exclude-globs "$HISTORY_EXCLUDE_GLOBS"
        else
          # A base was requested, so this is a gate, and a gate runs two scans
          # because neither one alone is sufficient.
          #
          # The range scan below is the one that reads a diff, and on its own
          # it can pass in silence. `git --since-commit BASE --branch REF`
          # walks commits in COMMITTER DATE order and stops the instant it
          # emits BASE, so when the base tip is dated newer than the commits
          # under review the walk ends after a single chunk having examined
          # nothing. A pull_request checkout makes that the ordinary case
          # rather than a corner: HEAD is the merge ref whose first parent IS
          # base.sha. Measured on exactly that topology with a planted DSN in
          # the branch — `--branch HEAD` reports 1 chunk and exits 0, while
          # `--branch <head sha>` reports 2 chunks and exits 183. That is what
          # the `head` input is for, and why it must not be handed HEAD.
          #
          # The filesystem scan is the belt to that braces. It reads the
          # checked-out tree, so no commit ordering, rewritten date or unusual
          # merge shape can hide a credential from it, and it honours
          # `trufflehog:ignore` markers exactly as the range scan does. It
          # does need .git kept out: measured, `filesystem .` descends into it
          # and reports secrets read straight out of loose objects and
          # packfiles, which would resurrect the pre-marker fixture named
          # above and so fail every gate forever. The regex is anchored on a
          # path separator rather than the string start so it holds whether
          # the scan root is given as `.` or as an absolute path, and `.git/`
          # with its trailing slash leaves `.github/` alone.
          printf '(^|/)\\.git/\n' > "$tmp/exclude-paths.txt"
          scan "working tree" filesystem . "$results" --fail --no-update \
            --exclude-paths "$tmp/exclude-paths.txt"

          if [ -z "$HEAD_SHA" ]; then
            echo "::error::since was set but head was not; the range scan cannot run"
            exit 1
          fi

          # A requested base that is not in this clone is not the same thing
          # as no base at all, and the two must not converge on the same code
          # path. Falling back to a history walk here would drag
          # --exclude-globs into a gate, excluding the one file a gate most
          # has to watch precisely when someone force-pushes. So only the
          # range scan is skipped; the working-tree scan above has already
          # covered the tree, and the weekly workflow still covers history.
          #
          # Two cases reach here: a first push to a branch, where
          # github.event.before is all zeros, and a force-push whose previous
          # tip was never fetched.
          if git cat-file -e "${SINCE}^{commit}" 2>/dev/null; then
            scan "range ${SINCE}..${HEAD_SHA}" git 'file://.' "$results" \
              --fail --no-update --since-commit "$SINCE" --branch "$HEAD_SHA"
          else
            echo "::notice::base commit ${SINCE} is not in this clone, so the range scan is skipped; the working-tree scan above still gated this run"
          fi
        fi

        if [ "$findings" -ne 0 ]; then
          exit 1
        fi
