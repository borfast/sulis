name: secret scan

# The weekly counterpart to ci.yml's trufflehog step. That one scans a diff,
# which is the right gate for a change: it stops a credential entering the
# tree. This one re-walks the whole history, because trufflehog's detector set
# grows — a credential that today's detectors do not recognise is found by a
# later version, and a diff scan never looks again at a commit that already
# passed one.
#
# Its own file rather than a job in ci.yml because a `schedule` trigger there
# would fire the test, postgres, analyze and fuzz jobs on the same cron.
on:
  schedule:
    # Mondays, 04:17 UTC. Deliberately not on the hour: GitHub queues cron
    # runs, and the top of the hour is where everyone else's sit. Note that
    # GitHub disables scheduled workflows in a repository with no activity for
    # 60 days, and mails the maintainer when it does.
    - cron: '17 4 * * 1'
  # So the full walk can also be run on demand — after a leak scare, or to
  # confirm a detector-set bump before Monday.
  workflow_dispatch:

# Least privilege, as in ci.yml: this reads the repository and reports through
# the job's own exit status.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: full history
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is the whole point of this workflow: the default clone
      # holds one commit, and a full-history scan of one commit is not one. It
      # fetches every branch and tag, so the walk covers commits that never
      # reached main as well.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No `since` input, so the action walks everything. It fetches a
      # checksum-verified release binary and needs no Go toolchain, which is
      # why this job has no setup-go step. The action excludes one path from a
      # history walk — a test file holding a fixture DSN that predates its own
      # `trufflehog:ignore` marker — and its own comments carry the reasoning.
      - name: trufflehog
        uses: ./.github/actions/trufflehog
