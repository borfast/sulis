name: secret scan

# The weekly counterpart to ci.yml's trufflehog step. That one gates a change,
# scanning the working tree and the commit range: it stops a credential
# entering the tree. This one re-walks the whole history, because trufflehog's
# detector set grows — a credential that today's detectors do not recognise is
# found by a later version, and a gate never looks again at a commit that
# already passed one.
#
# Its own file rather than a job in ci.yml because a `schedule` trigger there
# would fire the test, postgres, analyze and fuzz jobs on the same cron.
on:
  schedule:
    # Mondays, 04:17 UTC. Deliberately not on the hour: GitHub queues cron
    # runs, and the top of the hour is where everyone else's sit. Note that
    # GitHub disables scheduled workflows in a repository with no activity for
    # 60 days, and mails the maintainer when it does.
    - cron: '17 4 * * 1'
  # So the full walk can also be run on demand — after a leak scare, or to
  # confirm a detector-set bump before Monday.
  workflow_dispatch:

# Least privilege, as in ci.yml: this reads the repository and reports through
# the job's own exit status.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: full history
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is the whole point of this workflow: the default clone
      # holds one commit, and a full-history scan of one commit is not one. It
      # fetches every branch and tag, so the walk covers commits that never
      # reached main as well.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # No `head` input, so the action walks everything: `head` is the input
      # that selects a gate, and leaving both it and `since` empty is the one
      # mode that reads the whole history. It fetches a checksum-verified
      # release binary and needs no Go toolchain, which is why this job has no
      # setup-go step. This is also the only mode allowed to exclude a path —
      # a test file holding a fixture DSN that predates its own
      # `trufflehog:ignore` marker — and the action's comments carry the
      # reasoning, including why no gate may reach that exclusion.
      - name: trufflehog
        uses: ./.github/actions/trufflehog
