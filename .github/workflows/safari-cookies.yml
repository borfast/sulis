name: safari cookies

# Manual and informational only. It reports a measurement rather than
# asserting one, because what Safari does with a Secure cookie over plain HTTP
# is the open question behind the cookie-name caveat. Keep this workflow out
# of scheduled runs and required CI checks.
on:
  workflow_dispatch:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  safari:
    name: safari cookie acceptance
    # The only GitHub-hosted runner with Safari on it. Free for this repo
    # because the repo is public.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true

      # Remote automation is off in a stock Safari and enabling it needs
      # root. The runner user has passwordless sudo.
      - name: enable safaridriver
        run: sudo safaridriver --enable

      - name: start safaridriver
        run: safaridriver --port 4444 &

      # Prints Safari/macOS/runner context and a five-cookie table — default
      # and renamed session/CSRF cookies plus a non-Secure control — with each
      # result marked "stored" or "dropped" for localhost and 127.0.0.1.
      - name: probe (informational)
        run: go run .github/safari/main.go
