name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go.mod floor and the current release.
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      # gofmt walks the directory tree rather than the module graph, so this
      # already covers the nested store/sql module below. The other gates do
      # not: `./...` stops at a nested go.mod, which is why every one of them
      # is repeated with store/sql as the working directory.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./...

      # store/sql is a separate module on purpose (ratified decision #3): a SQL
      # driver must never enter the dependency graph of an application that
      # brings its own store. Its acceptance criterion is the storetest
      # conformance suite passing unmodified against the SQLite stores, and
      # -race is what makes that suite's concurrency subtests worth running:
      # they exist to catch a check-and-mutate that is really a read then a
      # write.
      #
      # The PostgreSQL store's conformance tests SKIP here, because
      # SULIS_POSTGRES_TEST_URL is unset — exactly what a contributor without a
      # database sees. The postgres job below is where they actually run.
      - name: build store/sql
        working-directory: store/sql
        run: go build ./...
      - name: vet store/sql
        working-directory: store/sql
        run: go vet ./...
      - name: test store/sql
        working-directory: store/sql
        run: go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./...

  postgres:
    name: store/sql conformance (postgres)
    runs-on: ubuntu-latest

    # A real database, because that is the whole claim: the same unmodified
    # storetest suite that memstore and the SQLite store pass must pass against
    # PostgreSQL, whose concurrency the other two do not have. The image is
    # pinned by digest for the same reason every action above is pinned by SHA
    # — a tag is a moving target — and the tag it resolved to is named beside
    # it so the next bump is a readable diff.
    services:
      postgres:
        image: postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 # 17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sulis_test
        ports:
          - 5432:5432
        # The job's steps do not start until this reports healthy, so the test
        # run never races the server's first boot.
        options: >-
          --health-cmd "pg_isready -U postgres -d sulis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # -race, like every other run of this suite: the concurrency subtests are
      # the point of running it against a real database at all. Every test
      # function gets its own PostgreSQL schema and drops it afterwards, so the
      # one database serves all seven conformance runs without them seeing each
      # other's rows.
      - name: test store/sql against postgres
        working-directory: store/sql
        env:
          SULIS_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/sulis_test?sslmode=disable
        run: go test -race -covermode=atomic -coverprofile=coverage.out -count=1 ./postgres/...

  analyze:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # All three tools are pinned. An unpinned @latest would execute whatever
      # that resolves to on the day CI runs. Dependabot proposes the bumps.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # Same three tools, same pins, against the nested store/sql module.
      - name: staticcheck (store/sql)
        working-directory: store/sql
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: gosec (store/sql)
        working-directory: store/sql
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...

      - name: govulncheck (store/sql)
        working-directory: store/sql
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # A short, deterministic smoke check, not a fuzzing budget: 10s per
      # hand-rolled parser is enough to catch a regression the checked-in
      # seed/crasher corpus alone wouldn't (a mutated property, a re-broken
      # invariant). The real 60s-per-target runs are done locally; see
      # PROGRESS.md's T402 entry for what each one found. -run='^$' skips
      # the package's other tests here, since the main `test` job above
      # already runs those.
      - name: fuzz FuzzDecodeHash
        run: go test -run='^$' -fuzz='^FuzzDecodeHash$' -fuzztime=10s .
      - name: fuzz FuzzNormalizeEmail
        run: go test -run='^$' -fuzz='^FuzzNormalizeEmail$' -fuzztime=10s .
      - name: fuzz FuzzRecoveryCanonical
        run: go test -run='^$' -fuzz='^FuzzRecoveryCanonical$' -fuzztime=10s ./recovery
      - name: fuzz FuzzGenerateCode
        run: go test -run='^$' -fuzz='^FuzzGenerateCode$' -fuzztime=10s ./totp
